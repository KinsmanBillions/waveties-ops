{% extends "base.html" %}
{% block title %}Edit Client – WaveTies{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Edit Client {{ client.client_id }}</h1>
  <a href="{{ url_for('ops_clients') }}" class="btn btn-outline">← Back</a>
</div>

<div class="card">
  <form method="post">
    <div class="form-row">
      <div class="form-group"><label>Company Name *</label>
        <input name="company_name" value="{{ client.company_name }}" required>
      </div>
      <div class="form-group"><label>Contact Person</label>
        <input name="contact_person" value="{{ client.contact_person or '' }}">
      </div>
      <div class="form-group"><label>Phone</label>
        <input name="phone" value="{{ client.phone or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label>
        <input name="email" type="email" value="{{ client.email or '' }}">
      </div>
      <div class="form-group"><label>Country</label>
        <input name="country" value="{{ client.country or '' }}">
      </div>
      <div class="form-group"><label>City</label>
        <input name="city" value="{{ client.city or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Client Type</label>
        <select name="client_type">
          {% for t in client_types %}
          <option value="{{ t }}" {% if t == client.client_type %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Preferred Currency</label>
        <select name="preferred_currency">
          {% for c in currencies %}
          <option value="{{ c }}" {% if c == client.preferred_currency %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Credit Terms (Days)</label>
        <input name="credit_terms" type="number" min="0" value="{{ client.credit_terms or 0 }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Status</label>
        <select name="status">
          {% for s in statuses %}
          <option value="{{ s }}" {% if s == client.status %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group"><label>Notes / KYC</label>
      <textarea name="notes" rows="3">{{ client.notes or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('ops_clients') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
