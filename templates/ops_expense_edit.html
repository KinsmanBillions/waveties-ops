{% extends "base.html" %}
{% block title %}Edit {{ e.expense_id }} – WaveTies{% endblock %}
{% block content %}
<div class="page-header">
  <h1 style="margin:0;">Edit expense {{ e.expense_id }}</h1>
  <p style="color:var(--muted);margin:0.25rem 0 0;"><a href="{{ url_for('ops_expenses') }}">← Back to expenses</a></p>
</div>
<div class="card">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label>Date *</label>
        <input type="date" name="expense_date" value="{{ e.expense_date }}" required>
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select name="category" required>
          {% for c in categories %}
          <option value="{{ c }}" {% if e.category==c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Subcategory</label>
        <input name="subcategory" value="{{ e.subcategory or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>Description *</label>
        <input name="description" value="{{ e.description or '' }}" required>
      </div>
      <div class="form-group">
        <label>Payee</label>
        <input name="payee" value="{{ e.payee or '' }}">
      </div>
      <div class="form-group">
        <label>System user</label>
        <select name="worker_username">
          <option value="">— none —</option>
          {% for u in users %}
          <option value="{{ u.username }}" {% if e.worker_username==u.username %}selected{% endif %}>{{ u.name }} ({{ u.username }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Currency *</label>
        <select name="currency" required>
          {% for c in currencies %}
          <option value="{{ c }}" {% if e.currency==c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Amount *</label>
        <input type="number" step="0.01" name="amount" value="{{ e.amount or 0 }}" required>
      </div>
      <div class="form-group">
        <label>USD equivalent *</label>
        <input type="number" step="0.01" name="amount_usd" value="{{ e.amount_usd or 0 }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Payment method</label>
        <select name="payment_method">
          {% for m in methods %}
          <option {% if e.payment_method==m %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Pay from account</label>
        <select name="account">
          <option value="">— none —</option>
          {% for key, label in accounts %}
          <option value="{{ key }}" {% if e.account==key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          {% for s in ['Paid','Pending','Approved'] %}
          <option {% if e.status==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Reference</label>
        <input name="reference" value="{{ e.reference or '' }}">
      </div>
      <div class="form-group" style="flex:2;">
        <label>Notes</label>
        <input name="notes" value="{{ e.notes or '' }}">
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{{ url_for('ops_expenses') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
