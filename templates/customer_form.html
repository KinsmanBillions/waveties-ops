{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'New' }} Customer – WaveTies{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{{ 'Edit Customer' if customer else 'New Customer' }}</h1>
  <a href="{{ url_for('customers_list') }}" class="btn btn-outline">← Back</a>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST">
    <div class="form-group">
      <label>Name *</label>
      <input type="text" name="name" value="{{ customer.name if customer else '' }}" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="{{ customer.email if customer else '' }}">
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" value="{{ customer.phone if customer else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
