{% extends "base.html" %}
{% block title %}Reset Password – WaveTies{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card" style="max-width:420px;">
    <h1 style="font-size:1.25rem;">Set New Password</h1>
    <p class="tagline" style="margin-bottom:1.25rem;">Account: <b>{{ username }}</b></p>

    <form method="POST">
      <div class="form-group">
        <label>New password</label>
        <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" name="password2" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
    </form>

    <p style="margin-top:1.25rem;font-size:0.82rem;text-align:center;">
      <a href="{{ url_for('login') }}">← Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
