{% extends "base.html" %}
{% block title %}Forgot Password – WaveTies{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card" style="max-width:420px;">
    <h1 style="font-size:1.25rem;">Forgot Password</h1>
    <p class="tagline" style="margin-bottom:1.25rem;">Enter your username to request a reset.</p>

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus placeholder="admin">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Continue</button>
    </form>

    <p style="margin-top:1.25rem;font-size:0.82rem;text-align:center;">
      <a href="{{ url_for('login') }}">← Back to login</a>
      &nbsp;·&nbsp;
      <a href="{{ url_for('admin_recovery') }}">Admin recovery</a>
    </p>
  </div>
</div>
{% endblock %}
