{% extends "base.html" %}
{% block title %}Login – WaveTies{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:1rem;">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="WaveTies"
           style="height:64px;width:64px;border-radius:10px;"
           onerror="this.style.display='none'">
    </div>
    <h1>WaveTies</h1>
    <p class="tagline">{{ company.tagline or "Stronger Ties" }}</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus placeholder="admin or worker">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">
        Sign In
      </button>
    </form>

    <p style="margin-top:1.25rem;font-size:0.75rem;color:#888;text-align:center;">
      Demo: <b>admin</b>/admin123 · <b>worker</b>/worker123 · <b>kofi</b>/kofi123
    </p>
  </div>
</div>
{% endblock %}
